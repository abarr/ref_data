name: Elixir CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {elixir: '1.18.4', otp: '27'}
          - {elixir: '1.19.5', otp: '28'}
          - {elixir: '1.20.5', otp: '27'}
          - {elixir: '1.20.5', otp: '28'}
          - {elixir: '1.20.5', otp: '29.1.2', lint: true}
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors
      # Formatting, linting and packaging are checked once, on the pinned toolchain.
      - if: matrix.lint
        run: mix format --check-formatted
      - if: matrix.lint
        run: mix credo --strict
      - if: matrix.lint
        run: mix hex.audit
      - if: matrix.lint
        run: mix hex.build
      - if: matrix.lint
        run: MIX_ENV=dev mix docs --warnings-as-errors
